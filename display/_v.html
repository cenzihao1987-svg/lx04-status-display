<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- 不锁 initial-scale：物理 800 ÷ dpr1.5 = 534 CSS 视口，锁了只能露出 67%（见 AGENTS.md） -->
<meta name="viewport" content="width=800">
<title>video diag</title>
<style>
  /* 只用最老的 CSS，这一页必须在任何 WebView 上都显示得出来 */
  body { margin:0; padding:4px 8px; background:#000; color:#fff;
         font-family:monospace,sans-serif; font-size:12px; line-height:1.3; }
  h1 { margin:0 0 2px; font-size:15px; color:#8ab4ff; }
  table { border-collapse:collapse; }
  td { padding:0 6px 0 0; vertical-align:top; white-space:nowrap; }
  td.k { color:#9aa4b2; }
  .ok { color:#4ade80; }
  .no { color:#ff6b6b; font-weight:bold; }
  .env { color:#9aa4b2; margin-bottom:4px; }
  .cell { display:inline-block; vertical-align:top; margin-right:14px; }
  /* 和 index.html 里 .vid 同一套写法，好复现拉伸 */
  .shot { position:relative; width:200px; height:126px; overflow:hidden;
          border:1px solid #2b3442; background:#111; }
  .shot video { position:absolute; top:0; right:0; bottom:0; left:0;
                width:200px; height:126px; object-fit:cover; }
  .cap { color:#9aa4b2; margin:2px 0 1px; }
</style>
</head>
<body>
<h1>视频诊断</h1>
<div class="env" id="env"></div>

<div class="cell">
  <div class="shot"><video id="v1" muted loop playsinline webkit-playsinline preload="auto"></video></div>
  <div class="cap">meili（Codex）</div>
  <table id="t1"></table>
</div>
<div class="cell">
  <div class="shot"><video id="v2" muted loop playsinline webkit-playsinline preload="auto"></video></div>
  <div class="cap">canyon（Claude）</div>
  <table id="t2"></table>
</div>

<div class="env" id="tip" style="margin-top:6px">
  点一下页面 = 补一次用户手势，然后自动重试 play()，看「重试」那行的结果
</div>

<script>
function row(k, v, good) {
  var cls = good === undefined ? '' : (good ? 'ok' : 'no');
  return '<tr><td class="k">' + k + '</td><td class="' + cls + '">' + v + '</td></tr>';
}

var NET = ['EMPTY', 'IDLE', 'LOADING', 'NO_SOURCE'];
var ERRS = { 1:'ABORTED', 2:'NETWORK', 3:'DECODE', 4:'SRC_NOT_SUPPORTED' };

// ── 环境 ──
var e = [];
e.push('视口 ' + window.innerWidth + 'x' + window.innerHeight);
e.push('dpr ' + window.devicePixelRatio);
var m = navigator.userAgent.match(/Chrome\/(\d+)/);
e.push('Chrome ' + (m ? m[1] : '?'));
e.push('可见 ' + document.visibilityState + (document.hidden ? '(hidden)' : ''));
var fit = document.createElement('div');
fit.style.cssText = 'object-fit:cover';
e.push('object-fit ' + (fit.style.getPropertyValue('object-fit') ? '有' : '无'));
document.getElementById('env').innerHTML = e.join(' · ');

// ── 两路视频，错开 3 秒起播：先让第一路独占 VPU ──
var items = [];

function watch(id, tid, src, delay) {
  var v = document.getElementById(id), t = document.getElementById(tid);
  var st = { v:v, t:t, ev:'未开始', pres:'还没调', last:-1, moved:false };
  items.push(st);

  v.addEventListener('loadeddata', function () { st.ev = 'loadeddata'; }, false);
  v.addEventListener('playing',    function () { st.ev = 'playing'; }, false);
  v.addEventListener('error',      function () { st.ev = 'error 事件'; }, false);

  // ?t= 每次都绕开缓存，免得看到旧副本
  v.src = src + '?t=' + Date.now();

  st.attempt = function (label) {
    var p = v.play();
    if (p && p.then) {
      p.then(function () { st.pres = label + ' OK'; },
             function (err) { st.pres = label + ' 被拒 ' + ((err && err.name) || err); });
    } else {
      st.pres = label + ' 无 Promise';
    }
  };
  setTimeout(function () { st.attempt('play'); }, delay);
}

watch('v1', 't1', 'meili.mp4', 0);
watch('v2', 't2', 'canyon.mp4', 3000);

window.addEventListener('touchend', function () {
  for (var i = 0; i < items.length; i++) items[i].attempt('touch');
}, false);

function draw(st) {
  var v = st.v, r = v.getBoundingClientRect(), buf;
  if (v.currentTime > st.last + 0.05) st.moved = true;
  st.last = v.currentTime;
  try { buf = v.buffered.length ? v.buffered.end(0).toFixed(1) + 's' : '0'; }
  catch (x) { buf = '?'; }
  var s = [];
  s.push(row('play()', st.pres, st.pres.indexOf('OK') >= 0));
  s.push(row('事件', st.ev, st.ev === 'playing'));
  s.push(row('ready', v.readyState + (v.readyState >= 2 ? ' 有帧' : ' 无帧'), v.readyState >= 2));
  s.push(row('net', v.networkState + ' ' + (NET[v.networkState] || '?'), v.networkState === 2));
  s.push(row('err', v.error ? v.error.code + ' ' + (ERRS[v.error.code] || '') : '无', !v.error));
  s.push(row('paused', v.paused ? '是' : '否', !v.paused));
  s.push(row('time', v.currentTime.toFixed(2) + (st.moved ? ' 推进' : ' 不动'), st.moved));
  s.push(row('buffered', buf));
  s.push(row('muted/vol', v.muted + ' / ' + v.volume));
  s.push(row('固有/元素', v.videoWidth + 'x' + v.videoHeight + ' / ' +
             Math.round(r.width) + 'x' + Math.round(r.height)));
  st.t.innerHTML = s.join('');
}

setInterval(function () { for (var i = 0; i < items.length; i++) draw(items[i]); }, 500);
</script>
</body>
</html>
